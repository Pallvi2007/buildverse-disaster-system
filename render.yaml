services:
  # 1. Backend Service (FastAPI + LangGraph Container)
  - type: web
    name: buildverse-backend
    env: docker
    plan: starter        # ← changed from "free" (free web services no longer exist)
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: buildverse-db
          property: connectionString
    autoDeploy: true

  # 2. Frontend Service (React + Vite Static Site)
  - type: web
    name: buildverse-frontend
    runtime: static
    plan: free           # ← fine, static sites still have a free tier
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    ...