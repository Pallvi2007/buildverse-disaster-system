services:
  # 1. Backend Service (FastAPI + LangGraph Container)
  - type: web
    name: buildverse-backend
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: buildverse-db
          property: connectionString
    autoDeploy: true

  # 2. Frontend Service (React + Vite Static Site)
  - type: static
    name: buildverse-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://buildverse-backend.onrender.com
      - key: VITE_API_SECRET
        sync: false

# 3. Persistent Managed PostgreSQL Instance
databases:
  - name: buildverse-db
    plan: free
    databaseName: buildverse
    user: buildverse_user