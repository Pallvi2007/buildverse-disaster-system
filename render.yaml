services:
  # 1. Backend Service (FastAPI + LangGraph)
  - type: web
    name: buildverse-backend
    runtime: docker
    plan: free
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true

  # 2. Frontend Service (React + Vite Static Site)
  - type: web
    name: buildverse-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://buildverse-backend.onrender.com
      - key: VITE_API_SECRET
        sync: false